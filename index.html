<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futsal Manager Épico</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #0c111b;
    color: #f5f5f5;
    text-align: center;
}
h1, h2 { margin-bottom: 15px; }
.btn {
    background: linear-gradient(45deg, #ffcc00, #ff9900);
    border: none;
    padding: 10px 20px;
    margin: 5px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: #000;
    transition: 0.2s;
}
.btn:hover {
    transform: scale(1.1);
    background: linear-gradient(45deg, #ffd633, #ffb300);
}
.estrategia.active {
    background: #00ccff;
    color: #000;
    box-shadow: 0 0 15px #00ccff;
    transform: scale(1.1);
}
table {
    width: 90%;
    margin: 10px auto 20px auto;
    border-collapse: collapse;
}
th, td {
    border: 1px solid #f5f5f5;
    padding: 8px;
    text-align: center;
}
tr.tu-equipo {
    background: #ffcc00;
    font-weight: bold;
}
.minuto, .marcador {
    font-size: 20px;
    margin: 10px 0;
}
#comentariosPartido, #otrosResultados, #resumenTemporada {
    width: 80%;
    margin: 10px auto;
    background: #1a1f2c;
    padding: 10px;
    border-radius: 8px;
    min-height: 80px;
    text-align: left;
    overflow-y: auto;
}
#infoPartido p { margin: 5px 0; }
</style>
</head>
<body>

<h1>Futsal Manager Épico <span id="temporada">2025/2026</span></h1>

<div id="seleccionEquipo">
    <h2>Elige tu liga y equipo</h2>
    <label>Liga:
        <select id="ligaSeleccionada">
            <option value="1">Primera División</option>
            <option value="2">Segunda División</option>
        </select>
    </label>
    <label>Equipo:
        <select id="equipoSeleccionado"></select>
    </label>
    <button class="btn" id="iniciarLigaBtn">Iniciar Liga</button>
</div>

<div id="partido" style="display:none;">
    <h2>Jornada <span id="numeroJornada">1</span></h2>
    <div id="infoPartido">
        <p>Jugando contra: <span id="rival">---</span></p>
        <p>Minuto: <span id="minuto">0</span>/40</p>
    </div>
    <div class="marcador">
        <span id="golLocal">0</span> - <span id="golVisitante">0</span>
    </div>
    <div>
        Estrategia:
        <button class="btn estrategia" id="btnEquilibrada" onclick="cambiarEstrategia('equilibrada')">Equilibrada</button>
        <button class="btn estrategia" id="btnOfensiva" onclick="cambiarEstrategia('ofensiva')">Ofensiva</button>
        <button class="btn estrategia" id="btnDefensiva" onclick="cambiarEstrategia('defensiva')">Defensiva</button>
    </div>
    <div id="comentariosPartido"></div>
    <button class="btn" id="iniciarPartidoBtn">Iniciar Partido</button>
    <button class="btn" id="siguienteJornadaBtn" style="display:none;" onclick="simularProximaJornada()">Siguiente Jornada</button>
</div>

<h2>Clasificación</h2>
<table id="tablaClasificacion">
    <thead>
        <tr>
            <th>Equipo</th>
            <th>Puntos</th>
            <th>GF</th>
            <th>GC</th>
            <th>DG</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<h2>Resultados de la jornada</h2>
<div id="otrosResultados"></div>

<div id="resumenTemporada" style="display:none;"></div>

<script>
// Equipos Primera y Segunda
let equiposPrimera = [
    { nombre:"Talavera FS", ataque:90, defensa:88 },
    { nombre:"Sierra de San Vicente FS", ataque:88, defensa:86 },
    { nombre:"Toledo FS", ataque:87, defensa:85 },
    { nombre:"Illescas FS", ataque:86, defensa:84 },
    { nombre:"Mejorada FS", ataque:85, defensa:83 },
    { nombre:"Torrijos FS", ataque:84, defensa:82 },
    { nombre:"Fuensalida FS", ataque:83, defensa:81 },
    { nombre:"Cuerva FS", ataque:82, defensa:80 },
    { nombre:"Velada FS", ataque:81, defensa:79 },
    { nombre:"Segurilla FS", ataque:80, defensa:78 },
    { nombre:"Cebolla FS", ataque:79, defensa:77 },
    { nombre:"Oropesa FS", ataque:78, defensa:76 },
    { nombre:"Calera y Chozas FS", ataque:77, defensa:75 },
    { nombre:"Bargas FS", ataque:76, defensa:74 },
    { nombre:"Navarmoral de la Mata FS", ataque:75, defensa:73 },
    { nombre:"Elite FS", ataque:74, defensa:72 },
    { nombre:"Alberche FS", ataque:73, defensa:71 },
    { nombre:"Navalcán FS", ataque:72, defensa:70 },
    { nombre:"Santa Olalla FS", ataque:71, defensa:69 },
    { nombre:"Pueblanueva FS", ataque:70, defensa:68 }
];

let equiposSegunda = [
    {nombre:"Navalmorales FS", ataque:69, defensa:67},
    {nombre:"Pepino FS", ataque:68, defensa:66},
    {nombre:"Belvis FS", ataque:68, defensa:66},
    {nombre:"Valmojado FS", ataque:67, defensa:65},
    {nombre:"Talavera la Nueva FS", ataque:67, defensa:65},
    {nombre:"Gamonal FS", ataque:66, defensa:64},
    {nombre:"Montesclaros FS", ataque:66, defensa:64},
    {nombre:"Cervera FS", ataque:65, defensa:63},
    {nombre:"Buenaventura FS", ataque:65, defensa:63},
    {nombre:"Puente del Arzobispo FS", ataque:64, defensa:62},
    {nombre:"Parrillas FS", ataque:64, defensa:62},
    {nombre:"Odelot FS", ataque:63, defensa:61},
    {nombre:"Yuncos FS", ataque:63, defensa:61},
    {nombre:"Patrocinio FS", ataque:62, defensa:60},
    {nombre:"Marrupe FS", ataque:62, defensa:60},
    {nombre:"Alcaudete FS", ataque:61, defensa:59},
    {nombre:"Alcolea FS", ataque:60, defensa:58},
    {nombre:"Las Ventas FS", ataque:60, defensa:58},
    {nombre:"Mejorada FS B", ataque:61, defensa:59},
    {nombre:"La Estrella FS", ataque:50, defensa:48}
];

let equipos = [];
let tabla = [], calendario = [];
let equipoJugador = null;
let jornadaActual = 0;
let estrategiaActual = 'equilibrada';
let temporada = "2025/2026";
let resultadosJornada = [];

const ligaSelect = document.getElementById("ligaSeleccionada");
const equipoSelect = document.getElementById("equipoSeleccionado");

function cargarEquipos(){
    equipoSelect.innerHTML = "";
    equipos = ligaSelect.value=="1"? equiposPrimera : equiposSegunda;
    equipos.forEach(eq=>{
        let opt=document.createElement("option");
        opt.value=eq.nombre;
        opt.textContent=eq.nombre;
        equipoSelect.appendChild(opt);
    });
}
cargarEquipos();
ligaSelect.addEventListener("change", cargarEquipos);

document.getElementById("iniciarLigaBtn").addEventListener("click",()=>{
    equipoJugador = equipoSelect.value;
    document.getElementById("seleccionEquipo").style.display="none";
    document.getElementById("partido").style.display="block";
    document.getElementById("resumenTemporada").style.display="none";
    iniciarLiga();
    marcarBotonEstrategia();
});

function cambiarEstrategia(e){
    estrategiaActual = e;
    marcarBotonEstrategia();
}
function marcarBotonEstrategia(){
    document.querySelectorAll(".estrategia").forEach(btn=>btn.classList.remove("active"));
    if(estrategiaActual==="equilibrada") document.getElementById("btnEquilibrada").classList.add("active");
    if(estrategiaActual==="ofensiva") document.getElementById("btnOfensiva").classList.add("active");
    if(estrategiaActual==="defensiva") document.getElementById("btnDefensiva").classList.add("active");
}

// Funciones de calendario y liga
function generarCalendario(){
    let lista = equipos.map(e=>e.nombre);
    if(lista.length %2!==0) lista.push("BYE");
    let n = lista.length;
    let vueltas = [];
    for(let r=0;r<n-1;r++){
        let jornada=[];
        for(let i=0;i<n/2;i++){
            let local = lista[i], visitante=lista[n-1-i];
            if(local!=="BYE" && visitante!=="BYE") jornada.push([local,visitante]);
        }
        vueltas.push(jornada);
        let temp = lista.splice(1,1);
        lista = lista.slice(0,1).concat(lista.slice(1)).concat(temp);
    }
    calendario = vueltas.concat(vueltas.map(j=>j.map(p=>[p[1],p[0]]))).flat();
}

function iniciarLiga(){
    tabla = equipos.map(eq=>({nombre:eq.nombre,puntos:0,gf:0,gc:0,dg:0,ataque:eq.ataque,defensa:eq.defensa}));
    jornadaActual = 0;
    generarCalendario();
    resultadosJornada = [];
    actualizarTabla();
    document.getElementById("numeroJornada").textContent = jornadaActual+1;
}

// Las funciones de partido y actualización de tabla siguen igual que antes
// ...

// Añadimos resumen de temporada
function mostrarResumen(ascendidos, descendidos, campeon){
    const resumen = document.getElementById("resumenTemporada");
    resumen.style.display="block";
    resumen.innerHTML = `<h2>Resumen Temporada ${temporada}</h2>
        <p>Campeón: ${campeon}</p>
        <p>Equipos ascendidos: ${ascendidos.join(", ")}</p>
        <p>Equipos descendidos: ${descendidos.join(", ")}</p>
        <p>Tu equipo ha mejorado durante la temporada.</p>
        <button class="btn" onclick="iniciarSiguienteTemporada()">Iniciar Nueva Temporada</button>`;
}

function iniciarSiguienteTemporada(){
    document.getElementById("seleccionEquipo").style.display="block";
    document.getElementById("partido").style.display="none";
    document.getElementById("resumenTemporada").style.display="none";
    temporada = parseInt(temporada.split("/")[0])+1+"/"+(parseInt(temporada.split("/")[0])+2);
    document.getElementById("temporada").textContent = temporada;
    cargarEquipos();
}
</script>

</body>
</html>
